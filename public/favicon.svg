<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Vibrant Neon Blue/Cyan Gradient for "B" -->
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Speed Streaks Gradient -->
    <linearGradient id="streakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Rounded Card -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- High-Tech Geometric "B" with Speed Cuts -->
  <g filter="url(#glow)">
    <!-- Main Stylized B Body -->
    <path d="M 36 28
             L 74 28
             C 88 28, 98 37, 98 50
             C 98 59, 92 65, 84 68
             C 94 72, 100 80, 100 92
             C 100 106, 88 116, 72 116
             L 36 116
             Z
             M 54 44
             L 54 62
             L 72 62
             C 78 62, 82 58, 82 53
             C 82 48, 78 44, 72 44
             Z
             M 54 78
             L 54 100
             L 72 100
             C 79 100, 84 95, 84 89
             C 84 83, 79 78, 72 78
             Z"
          fill="url(#bGrad)"/>

    <!-- High-Tech Speed Accents / Wings on the Left -->
    <rect x="22" y="44" width="8" height="18" rx="4" fill="url(#streakGrad)"/>
    <rect x="18" y="70" width="12" height="18" rx="4" fill="url(#streakGrad)"/>
    <rect x="24" y="94" width="6" height="14" rx="3" fill="url(#streakGrad)"/>

    <!-- Neon Core Highlight Accent Dot -->
    <circle cx="70" cy="53" r="3.5" fill="#e0f2fe"/>
    <circle cx="70" cy="89" r="3.5" fill="#e0f2fe"/>
  </g>
</svg>
